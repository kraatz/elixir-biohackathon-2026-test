---
# Deploy the OpenWebUI pentest frontend inside the SPE VM.
# OpenWebUI (chat) + open-terminal (tool server holding the SPE CA and the
# WES/DRS/TRS bases) run in their own compose project. Bound to 127.0.0.1;
# operators reach it over an SSH tunnel. Runs after the workflow stack so the
# self-signed CA and the three APIs already exist.
- name: de.NBI LLM API key present
  ansible.builtin.assert:
    that:
      - (spe_denbi_api_key | default('', true)) | length > 0
    fail_msg: >-
      spe_denbi_api_key is empty. Export the key on the controller before
      running, e.g.
      export DENBI_LLM_API_KEY=$(grep '^OPENAI_API_KEY=' ~/agent-stack/webui.env | cut -d= -f2-)
      or pass -e spe_denbi_api_key=... (do not commit it to the repo).

- name: Sandbox image (open-terminal with the SPE CA and runbook)
  ansible.builtin.include_role:
    name: sandbox

- name: Rendered compose and env files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ spe_frontend_dir }}/{{ item.dest }}"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0640"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
    - { src: webui.env.j2, dest: webui.env }
    - { src: terminal.env.j2, dest: terminal.env }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  register: rendered

- name: Validate compose file
  ansible.builtin.command: docker compose -f docker-compose.yml config --quiet
  args:
    chdir: "{{ spe_frontend_dir }}"
  changed_when: false

- name: Frontend stack up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_frontend_dir }}"
    files: [docker-compose.yml]
    state: present
    recreate: "{{ 'always' if (rendered.changed or sandbox_image_changed) else 'auto' }}"

- name: Wait for OpenWebUI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/health"
    status_code: 200
  register: webui_up
  until: webui_up.status == 200
  retries: 40
  delay: 3
  changed_when: false

# The agent system prompt is a per-user setting in OpenWebUI, so it cannot be
# pre-seeded before anyone signs up. Instead the admin account is created up
# front and the prompt is attached to the model, where it applies to every chat.
- name: Create the OpenWebUI admin (first account becomes admin)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signup"
    method: POST
    body_format: json
    body:
      name: "{{ spe_webui_admin_name }}"
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: [200, 400, 403]   # 400/403 = account exists or signup closed (re-run); sign-in below checks it
  register: webui_signup
  changed_when: webui_signup.status == 200
  no_log: true

- name: Sign in as the OpenWebUI admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signin"
    method: POST
    body_format: json
    body:
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: 200
  register: webui_signin
  changed_when: false
  no_log: true

- name: Attach the agent system prompt to the model (applies to every chat)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/models/import"
    method: POST
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    body_format: json
    body:
      models:
        - id: "{{ spe_webui_model_id }}"
          base_model_id: null
          name: "{{ spe_webui_model_id }}"
          meta: {}
          params:
            system: "{{ lookup('ansible.builtin.file', role_path ~ '/../sandbox/files/system_prompt.txt') }}"
          is_active: true
    status_code: 200
  register: webui_model
  changed_when: webui_model.status == 200
  no_log: true
