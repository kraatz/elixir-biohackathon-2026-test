---
# Create (or converge) one SPE evaluation instance.
#   ansible-playbook playbooks/create.yml -e @instances/<name>.yml
- name: Provision OpenStack resources
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Instance parameters present
      ansible.builtin.assert:
        that:
          - spe_instance is string and spe_instance | length > 0
          - spe_seed is not none
          - spe_provision in ['openstack', 'existing']
          - spe_frontend | default('', true) in ['', 'none', 'openwebui', 'agui']
        fail_msg: >-
          set spe_instance and spe_seed (pass -e @instances/<name>.yml); spe_provision is
          openstack or existing; spe_frontend is none, openwebui or agui
  roles:
    - { role: os_provision, tags: [always], when: spe_provision == 'openstack' }
    - { role: existing_host, tags: [always], when: spe_provision == 'existing' }

# The VM's work runs in overlapping lanes. As soon as Docker is up, the package
# install, the image pulls and the image builds (stack, sandbox, AG-UI) start in
# the background; the data copy and the seeding run meanwhile; every consumer
# joins the job it needs right before it needs it (the *_from: wait tasks).
# Each tag still selects one stage for a re-run against an existing instance.
- name: Configure the API instance
  hosts: spe_api
  gather_facts: false
  become: false
  pre_tasks:
    - name: Wait for SSH
      tags: [always]
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 5
    - name: Gather facts
      tags: [always]
      ansible.builtin.setup:
    - name: Wait for cloud-init
      tags: [always]
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Existing host is fit and free for this instance
      tags: [always]
      when: spe_provision == 'existing'
      block:
        - name: Passwordless sudo
          ansible.builtin.command: sudo -n true
          changed_when: false
        - name: Ownership, paths, ports, compose projects and disk
          # Read-only; see the script header for the rules.
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/../roles/existing_host/files/spe_preflight.py
              {{ spe_preflight_cfg | to_json | b64encode }}
            executable: python3
          vars:
            spe_preflight_cfg:
              instance: "{{ spe_instance }}"
              provision: "{{ spe_provision }}"
              marker: /etc/spe-instance
              manifest: /etc/spe-instance.json
              paths:
                stack_dir: "{{ spe_stack_dir }}"
                frontend_dir: "{{ spe_frontend_dir }}"
                data_root: "{{ spe_data_root }}"
              ports: "{{ spe_owned_ports }}"
              projects: "{{ spe_compose_projects }}"
              min_free_gb: "{{ spe_min_free_gb | int }}"
          register: spe_preflight_run
          changed_when: false
        - name: Preflight result
          ansible.builtin.set_fact:
            spe_preflight: "{{ spe_preflight_run.stdout | from_json }}"
        - name: Refuse a host that is not free for this instance
          ansible.builtin.assert:
            that: spe_preflight.problems | length == 0
            fail_msg: "{{ inventory_hostname }} refused, nothing changed: {{ spe_preflight.problems | join('; ') }}"
    - name: Deterministic service-info tokens
      tags: [always]
      ansible.builtin.set_fact:
        spe_svc_token_wes: "SVCINFO-{{ ((spe_seed | string ~ ':svc:wes') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_drs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:drs') | hash('sha256'))[:10] | upper }}"
        spe_svc_token_trs: "SVCINFO-{{ ((spe_seed | string ~ ':svc:trs') | hash('sha256'))[:10] | upper }}"
  tasks:
    - name: Baseline (Docker, packages, directories; seeding tools in the background)
      ansible.builtin.import_role:
        name: base
      become: true
      tags: [base]

    - name: Coder agent (first, so the portal shows the workspace connected early)
      ansible.builtin.import_role:
        name: coder_agent
      become: true
      tags: [coder]
      when: spe_coder_agent_token is defined

    - name: Image pulls in the background
      ansible.builtin.import_role:
        name: prefetch
      tags: [stack, frontend]

    - name: Certificate and trust anchor
      ansible.builtin.import_role:
        name: tls
      tags: [stack, frontend]

    - name: Sandbox image build in the background
      ansible.builtin.import_role:
        name: sandbox
      tags: [frontend]
      when: spe_frontend in ['openwebui', 'agui']

    - name: Stack sources and image builds in the background
      ansible.builtin.import_role:
        name: workflow_stack
        tasks_from: build
      tags: [stack]

    - name: Agent and chat UI image builds in the background
      ansible.builtin.import_role:
        name: agui
        tasks_from: build
      tags: [frontend]
      when: spe_frontend == 'agui'

    - name: Data copy and seeding
      ansible.builtin.import_role:
        name: spe_data
      tags: [data]

    - name: Data checksums in the background
      ansible.builtin.import_role:
        name: drs_register
        tasks_from: hash
      tags: [drs]

    - name: Workflow stack
      ansible.builtin.import_role:
        name: workflow_stack
      tags: [stack]

    - name: DRS registration
      ansible.builtin.import_role:
        name: drs_register
      tags: [drs]

    - name: TRS workflows
      ansible.builtin.import_role:
        name: trs_install
      tags: [trs]

    - name: OpenWebUI frontend
      ansible.builtin.import_role:
        name: openwebui
      tags: [frontend]
      when: spe_frontend == 'openwebui'

    - name: AG-UI frontend
      ansible.builtin.import_role:
        name: agui
      tags: [frontend]
      when: spe_frontend == 'agui'

    - name: Hand-off files
      ansible.builtin.import_role:
        name: handoff
      tags: [handoff]

    - name: Verification
      ansible.builtin.import_role:
        name: verify
      tags: [verify]
