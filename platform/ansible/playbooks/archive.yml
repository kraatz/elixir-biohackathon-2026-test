---
# Save one instance's run to <spe_runs_root>/<UTC time>_<instance>/: parameters,
# canary record and, with the openwebui frontend, chats and notes (incl. the
# run report). Works for OpenStack and existing-VM instances.
#   ansible-playbook playbooks/archive.yml -e @instances/<name>.yml
# destroy.yml runs this first and stops if it fails, so chats are never lost
# by accident. -e spe_archive_skip=true skips it.
- name: Find the instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Instance name present
      ansible.builtin.assert:
        that: spe_instance is string and spe_instance | length > 0

    - name: Archive time
      ansible.builtin.set_fact:
        spe_archive_time: "{{ now(utc=True).strftime('%Y-%m-%dT%H%M%SZ') }}"

    - name: Hand-off file from creation
      ansible.builtin.stat:
        path: "{{ spe_output_dir }}/hosts.yml"
      register: archive_handoff_file

    - name: Read hand-off file
      ansible.builtin.set_fact:
        handoff: "{{ lookup('ansible.builtin.file', spe_output_dir ~ '/hosts.yml') | from_yaml }}"
      when: archive_handoff_file.stat.exists

    - name: Server (OpenStack instances exist only while their server does)
      openstack.cloud.server_info:
        cloud: "{{ spe_cloud }}"
        name: "{{ spe_instance }}-api"
      register: archive_server
      when: not spe_archive_skip and spe_provision == 'openstack'

    - name: Instance to archive
      # existing: the hand-off file names the host; openstack: the server must exist.
      ansible.builtin.set_fact:
        archive_present: >-
          {{ not spe_archive_skip and archive_handoff_file.stat.exists
             and (spe_provision == 'existing' or archive_server.servers | length > 0) }}

    - name: Nothing to archive
      ansible.builtin.debug:
        msg: >-
          {{ 'archive skipped (spe_archive_skip)' if spe_archive_skip
             else (spe_output_dir ~ '/hosts.yml missing' if not archive_handoff_file.stat.exists
                   else spe_instance ~ '-api does not exist') }}
      when: not archive_present

    - name: Register instance host
      # Connect the way create.yml did: the recorded SSH target on an existing
      # VM, the generated key and the server's current address in OpenStack.
      ansible.builtin.add_host:
        name: "{{ spe_instance }}-api"
        groups: spe_api
        ansible_host: "{{ handoff.ssh_target if existing else (addrs | selectattr('OS-EXT-IPS:type', 'equalto', 'floating' if spe_connect_via == 'floating' else 'fixed') | map(attribute='addr') | first) }}"
        ansible_connection: "{{ 'local' if existing and handoff.ssh_target in ['localhost', '127.0.0.1'] else 'ssh' }}"
        ansible_user: "{{ spe_ssh_user }}"
        ansible_ssh_private_key_file: "{{ handoff.ssh_key | default(omit, true) }}"
        ansible_ssh_common_args: "{{ handoff.ssh_args if existing else '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' }}"
        ansible_python_interpreter: /usr/bin/python3
      vars:
        existing: "{{ spe_provision == 'existing' }}"
        addrs: "{{ (archive_server.servers | default([{}]))[0].addresses[spe_network] | default([]) }}"
      when: archive_present
      changed_when: false

- name: Export OpenWebUI from the instance
  hosts: spe_api
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reachable
      ansible.builtin.wait_for_connection:
        timeout: 120
    - name: Export
      ansible.builtin.include_role:
        name: run_archive
        tasks_from: export
      when: spe_frontend == 'openwebui'

- name: Write the run directory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write
      ansible.builtin.include_role:
        name: run_archive
        tasks_from: write
      vars:
        spe_run_dir: "{{ spe_runs_root }}/{{ spe_archive_time }}_{{ spe_instance }}"
      when: archive_present
