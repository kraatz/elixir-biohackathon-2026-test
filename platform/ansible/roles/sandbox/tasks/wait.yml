---
# Joins the image build started by main.yml and reports whether the image changed.
- name: Sandbox image built
  ansible.builtin.async_status:
    jid: "{{ sandbox_build_job.ansible_job_id }}"
  register: sandbox_build
  until: sandbox_build.finished
  retries: 720
  delay: 5

- name: Sandbox image changed
  ansible.builtin.set_fact:
    sandbox_image_changed: "{{ sandbox_build.changed }}"
