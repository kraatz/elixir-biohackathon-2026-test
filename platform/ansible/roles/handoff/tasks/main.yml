---
# Everything the operator and the agent side need, written on the controller only.
- name: Service-info canary records
  ansible.builtin.set_fact:
    spe_svc_canaries: >-
      {{ [
        {'token': spe_svc_token_wes, 'type': 'service-info', 'file': 'wes:/ga4gh/wes/v1/service-info', 'note': 'tags.deployment_ref'},
        {'token': spe_svc_token_drs, 'type': 'service-info', 'file': 'drs:/ga4gh/drs/v1/service-info', 'note': 'description'},
        {'token': spe_svc_token_trs, 'type': 'service-info', 'file': 'trs:/ga4gh/trs/v2/service-info', 'note': 'description'},
      ] if spe_canary_service_info else [] }}

- name: Assemble the canary record
  ansible.builtin.set_fact:
    spe_canary_record:
      instance: "{{ spe_instance }}"
      seed: "{{ spe_seed }}"
      api_host: "{{ spe_api_host }}"
      generated_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}"
      study_ids: "{{ spe_seed_result.study_ids }}"
      tokens: "{{ spe_seed_result.canaries + spe_drs_result.canaries + spe_trs_result.canaries + spe_svc_canaries }}"
  no_log: true

- name: Output directory on the controller
  ansible.builtin.file:
    path: "{{ spe_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Canary record (plaintext, controller only)
  ansible.builtin.copy:
    content: "{{ spe_canary_record | to_nice_json }}\n"
    dest: "{{ spe_output_dir }}/canaries.json"
    mode: "0600"
  delegate_to: localhost
  no_log: true

- name: Hash-only canary manifest (safe to share with detection tooling)
  ansible.builtin.copy:
    content: |-
      {% for t in spe_canary_record.tokens %}
      {{ t.token | hash('sha256') }}	{{ t.type }}
      {% endfor %}
    dest: "{{ spe_output_dir }}/canaries.manifest.sha256"
    mode: "0600"
  delegate_to: localhost
  no_log: true

- name: Encrypt canary record with age
  ansible.builtin.shell: >-
    age -r '{{ spe_age_recipient }}' -o canaries.json.age canaries.json && rm -f canaries.json
  args:
    chdir: "{{ spe_output_dir }}"
  delegate_to: localhost
  when: (spe_age_recipient | default('', true)) | length > 0
  no_log: true

- name: DRS inventory and installed workflows
  ansible.builtin.copy:
    content: "{{ item.content | to_nice_json }}\n"
    dest: "{{ spe_output_dir }}/{{ item.name }}"
    mode: "0600"
  loop:
    - { name: drs-inventory.json, content: "{{ spe_drs_result.inventory }}" }
    - { name: trs-installed.json, content: "{{ spe_trs_result.installed }}" }
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost

- name: Trust anchor for clients
  ansible.builtin.fetch:
    src: "{{ spe_stack_dir }}/deployment/certs/traefik.crt"
    dest: "{{ spe_output_dir }}/ca.crt"
    flat: true

- name: How the operator reaches the VM
  # One ssh prefix for every tunnel, built from the same connection fields
  # create.yml used; empty when the controller is the VM (no tunnel needed).
  ansible.builtin.set_fact:
    spe_ssh_prefix: >-
      {%- if spe_provision == 'existing' -%}
      {%- if spe_existing_host not in ['localhost', '127.0.0.1'] -%}
      ssh{{ (' -i ' ~ (spe_existing_ssh_key | quote)) if spe_existing_ssh_key else '' }}{{ (' ' ~ spe_existing_ssh_args) if spe_existing_ssh_args else '' }} {{ (spe_ssh_user ~ '@' ~ spe_existing_host) | quote }}
      {%- endif -%}
      {%- else -%}
      ssh -i {{ (spe_output_dir ~ '/ssh_key') | quote }} {{ (spe_ssh_user ~ '@' ~ ((spe_floating_ip | default('', true)) or spe_api_host)) | quote }}
      {%- endif -%}

- name: Connection details
  ansible.builtin.copy:
    content: |
      # Generated by spe-ansible for instance {{ spe_instance }}
      {{ spe_handoff | to_nice_yaml(width=1000) }}
    dest: "{{ spe_output_dir }}/hosts.yml"
    mode: "0600"
  vars:
    spe_handoff_common:
      instance: "{{ spe_instance }}"
      server: "{{ spe_instance }}-api"
      api_host: "{{ spe_api_host }}"
      floating_ip: "{{ spe_floating_ip | default('') }}"
      ssh_user: "{{ spe_ssh_user }}"
      provision: "{{ spe_provision }}"
      wes: "https://{{ spe_api_host }}/ga4gh/wes/v1"
      drs: "https://{{ spe_api_host }}/ga4gh/drs/v1"
      trs: "https://{{ spe_api_host }}/ga4gh/trs/v2"
      weskit_image: "{{ spe_weskit_image }}"
      frontend: "{{ spe_frontend }}"
    spe_handoff_ssh: >-
      {{ {'ssh_target': spe_existing_host, 'ssh_key': spe_existing_ssh_key | default('', true), 'ssh_args': spe_existing_ssh_args}
         if spe_provision == 'existing' else {'ssh_key': spe_output_dir ~ '/ssh_key'} }}
    spe_handoff_frontend: >-
      {{ ({'webui_url': 'http://127.0.0.1:' ~ spe_webui_local_port,
           'webui_tunnel': (spe_ssh_prefix ~ ' -N -L ' ~ spe_webui_local_port ~ ':127.0.0.1:' ~ spe_webui_local_port) if spe_ssh_prefix else '',
           'webui_auth': spe_webui_auth}
          | combine({'webui_admin_user': spe_webui_admin_email, 'webui_admin_password': spe_webui_admin_password} if spe_webui_auth else {}))
         if spe_frontend == 'openwebui' else {} }}
    spe_handoff_agui: >-
      {{ {'ui_url': 'http://127.0.0.1:' ~ spe_agui_ui_port,
          'agent_url': 'http://127.0.0.1:' ~ spe_agui_agent_port ~ '/agent',
          'agui_tunnel': (spe_ssh_prefix ~ ' -N -L ' ~ spe_agui_ui_port ~ ':127.0.0.1:' ~ spe_agui_ui_port
                          ~ ' -L ' ~ spe_agui_agent_port ~ ':127.0.0.1:' ~ spe_agui_agent_port) if spe_ssh_prefix else '',
          'agent_api_key_file': spe_output_dir ~ '/agent_api_key',
          'agent_model': spe_agent_model_provider ~ ':' ~ spe_agent_model}
         if spe_frontend == 'agui' else {} }}
    spe_handoff: "{{ spe_handoff_common | combine(spe_handoff_ssh, spe_handoff_frontend, spe_handoff_agui) }}"
  delegate_to: localhost

- name: Agent bearer key (controller only; promptfoo and the smoke run read it)
  ansible.builtin.copy:
    content: "{{ spe_agent_api_key }}\n"
    dest: "{{ spe_output_dir }}/agent_api_key"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when: spe_frontend == 'agui'

- name: Summary
  ansible.builtin.template:
    src: summary.md.j2
    dest: "{{ spe_output_dir }}/summary.md"
    mode: "0600"
  delegate_to: localhost
