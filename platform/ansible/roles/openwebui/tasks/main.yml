---
# Deploy the OpenWebUI pentest frontend inside the SPE VM.
# OpenWebUI (chat) + open-terminal (tool server holding the SPE CA and the
# WES/DRS/TRS bases) run in their own compose project. Bound to 127.0.0.1;
# operators reach it over an SSH tunnel. Runs after the workflow stack so the
# self-signed CA and the three APIs already exist.
- name: de.NBI LLM API key present
  ansible.builtin.assert:
    that:
      - (spe_denbi_api_key | default('', true)) | length > 0
    fail_msg: >-
      spe_denbi_api_key is empty. Export the key on the controller before
      running, e.g.
      export DENBI_LLM_API_KEY=$(grep '^OPENAI_API_KEY=' ~/agent-stack/webui.env | cut -d= -f2-)
      or pass -e spe_denbi_api_key=... (do not commit it to the repo).

- name: Frontend directory
  ansible.builtin.file:
    path: "{{ spe_frontend_dir }}"
    state: directory
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0750"

- name: Build-context files (Dockerfile, agent runbook)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ spe_frontend_dir }}/{{ item }}"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"
  loop:
    - Dockerfile.terminal
    - AGENTS.md
  register: ctx_files

- name: SPE trust anchor into the build context
  ansible.builtin.copy:
    src: "{{ spe_stack_dir }}/deployment/certs/traefik.crt"
    dest: "{{ spe_frontend_dir }}/spe-ca.crt"
    remote_src: true
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"
  register: ca_file

- name: Rendered compose and env files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ spe_frontend_dir }}/{{ item.dest }}"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0640"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
    - { src: webui.env.j2, dest: webui.env }
    - { src: terminal.env.j2, dest: terminal.env }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  register: rendered

- name: Build the open-terminal image with the SPE CA
  community.docker.docker_image:
    name: "{{ spe_frontend_terminal_image }}"
    build:
      path: "{{ spe_frontend_dir }}"
      dockerfile: Dockerfile.terminal
      pull: false
    source: build
    force_source: "{{ ctx_files.changed or ca_file.changed }}"
  register: term_build

- name: Validate compose file
  ansible.builtin.command: docker compose -f docker-compose.yml config --quiet
  args:
    chdir: "{{ spe_frontend_dir }}"
  changed_when: false

- name: Frontend stack up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_frontend_dir }}"
    files: [docker-compose.yml]
    state: present
    recreate: "{{ 'always' if (rendered.changed or term_build.changed) else 'auto' }}"

- name: Wait for OpenWebUI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/health"
    status_code: 200
  register: webui_up
  until: webui_up.status == 200
  retries: 40
  delay: 3
  changed_when: false

# The agent system prompt is a per-user setting in OpenWebUI, so it cannot be
# pre-seeded before anyone signs up. Instead the prompt is attached to the
# model, where it applies to every chat. That needs an admin token: with
# spe_webui_auth the admin account is created up front; without it (WEBUI_AUTH
# false) the sign-in call itself creates and returns OpenWebUI's single
# admin@localhost user, whatever credentials are sent.
- name: Create the OpenWebUI admin (first account becomes admin)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signup"
    method: POST
    body_format: json
    body:
      name: "{{ spe_webui_admin_name }}"
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: [200, 400]   # 400 = account already exists (idempotent re-run)
  register: webui_signup
  changed_when: webui_signup.status == 200
  when: spe_webui_auth
  no_log: true

- name: Sign in as the OpenWebUI admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/auths/signin"
    method: POST
    body_format: json
    body:
      email: "{{ spe_webui_admin_email }}"
      password: "{{ spe_webui_admin_password }}"
    status_code: 200
  register: webui_signin
  changed_when: false
  no_log: true

- name: Attach the agent system prompt to the model (applies to every chat)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/models/import"
    method: POST
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    body_format: json
    body:
      models:
        - id: "{{ spe_webui_model_id }}"
          base_model_id: null
          name: "{{ spe_webui_model_id }}"
          meta: {}
          params:
            system: "{{ lookup('ansible.builtin.file', 'system_prompt.txt') }}"
          is_active: true
    status_code: 200
  register: webui_model
  changed_when: webui_model.status == 200
  no_log: true

# Run report: the template lives in reports/ so it is versioned with the repo.
# Rendered here and created once as a pinned OpenWebUI note; an existing note
# with the same title is left alone so a re-run never overwrites a report.
- name: Run report (rendered template)
  ansible.builtin.template:
    src: "{{ spe_report_template }}"
    dest: "{{ spe_frontend_dir }}/run_report.md"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"
  register: report_md

- name: Run report as HTML (the note editor loads HTML; OpenWebUI ships a Markdown renderer)
  ansible.builtin.shell: >-
    docker compose exec -T open-webui python -c
    "import sys, markdown; sys.stdout.write(markdown.markdown(sys.stdin.read(), extensions=['tables']))"
    < run_report.md
  args:
    chdir: "{{ spe_frontend_dir }}"
  register: report_html
  changed_when: false

- name: Run report as Markdown
  ansible.builtin.slurp:
    src: "{{ spe_frontend_dir }}/run_report.md"
  register: report_md_file

- name: Existing notes
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/notes/"
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    status_code: 200
  register: webui_notes
  no_log: true

- name: Create the run report note
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/notes/create"
    method: POST
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    body_format: json
    body:
      title: "{{ spe_report_title }}"
      data:
        content:
          json: null
          md: "{{ report_md_file.content | b64decode }}"
          html: "{{ report_html.stdout }}"
      meta: null
      access_grants: []
    status_code: 200
  register: report_note
  changed_when: true
  when: spe_report_title not in (webui_notes.json | map(attribute='title') | list)
  no_log: true

- name: Pin the run report note
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spe_webui_local_port }}/api/v1/notes/{{ report_note.json.id }}/pin"
    method: POST
    headers:
      Authorization: "Bearer {{ webui_signin.json.token }}"
    status_code: 200
  when: report_note is changed
  no_log: true
