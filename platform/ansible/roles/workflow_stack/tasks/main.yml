---
# Clone, build and run the WESkit / drs-filer / trs-filer / Traefik stack.
- name: Source repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ spe_stack_dir }}/{{ item.dest }}"
    version: "{{ item.version }}"
    force: true
  loop:
    - { repo: "{{ spe_weskit_repo }}", dest: weskit-src, version: "{{ spe_weskit_commit | default(spe_weskit_branch, true) }}" }
    - { repo: "{{ spe_deployment_repo }}", dest: deployment, version: "{{ spe_deployment_commit }}" }
    - { repo: "{{ spe_drs_filer_repo }}", dest: drs-filer, version: "{{ spe_drs_filer_commit }}" }
    - { repo: "{{ spe_trs_filer_repo }}", dest: trs-filer, version: "{{ spe_trs_filer_commit }}" }
  loop_control:
    label: "{{ item.dest }}@{{ item.version }}"

- name: Resolve WESkit commit
  ansible.builtin.command: git -C {{ spe_stack_dir }}/weskit-src rev-parse --short=8 HEAD
  changed_when: false
  register: weskit_head

- name: Image names
  ansible.builtin.set_fact:
    spe_weskit_commit_short: "{{ weskit_head.stdout | trim }}"
    spe_weskit_image: "weskit-api:{{ weskit_head.stdout | trim }}"
    spe_drs_image: "drs-filer:{{ spe_drs_filer_commit[:7] }}"
    spe_trs_image: "trs-filer:{{ spe_trs_filer_commit[:7] }}"

- name: Which images exist already
  ansible.builtin.command: docker image inspect --format ok {{ item }}
  loop: ["{{ spe_weskit_image }}", "{{ spe_drs_image }}", "{{ spe_trs_image }}"]
  register: image_state
  changed_when: false
  failed_when: false

- name: Build WESkit image (several minutes)
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --build-arg
      - baseImage={{ spe_weskit_base_image }}
      - -t
      - "{{ spe_weskit_image }}"
      - "{{ spe_stack_dir }}/weskit-src"
  when: image_state.results[0].rc != 0
  async: 3600
  poll: 20

- name: Build drs-filer image
  ansible.builtin.command: docker build -t {{ spe_drs_image }} {{ spe_stack_dir }}/drs-filer
  when: image_state.results[1].rc != 0
  async: 1800
  poll: 15

- name: Build trs-filer image
  ansible.builtin.command: docker build -t {{ spe_trs_image }} {{ spe_stack_dir }}/trs-filer
  when: image_state.results[2].rc != 0
  async: 1800
  poll: 15

- name: Config and certificate directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ spe_stack_dir }}/config/weskit_config"
    - "{{ spe_stack_dir }}/deployment/certs"

- name: TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ spe_stack_dir }}/deployment/certs/traefik.key"
    size: 4096
    mode: "0600"

- name: TLS certificate signing request (IP SANs, own trust anchor)
  community.crypto.openssl_csr:
    path: "{{ spe_stack_dir }}/deployment/certs/traefik.csr"
    privatekey_path: "{{ spe_stack_dir }}/deployment/certs/traefik.key"
    common_name: "{{ spe_api_host }}"
    subject_alt_name: "{{ ['IP:' ~ spe_api_host, 'IP:127.0.0.1', 'DNS:localhost'] + (['IP:' ~ spe_floating_ip] if spe_floating_ip else []) }}"
    basic_constraints: ["CA:TRUE"]
    basic_constraints_critical: true

- name: Self-signed TLS certificate
  community.crypto.x509_certificate:
    path: "{{ spe_stack_dir }}/deployment/certs/traefik.crt"
    csr_path: "{{ spe_stack_dir }}/deployment/certs/traefik.csr"
    privatekey_path: "{{ spe_stack_dir }}/deployment/certs/traefik.key"
    provider: selfsigned
    selfsigned_not_after: "+{{ spe_cert_days }}d"
    mode: "0644"
  register: cert

- name: Trust the certificate system-wide
  ansible.builtin.copy:
    src: "{{ spe_stack_dir }}/deployment/certs/traefik.crt"
    dest: /usr/local/share/ca-certificates/spe-local-ca.crt
    remote_src: true
    mode: "0644"
  become: true
  register: ca_copy

- name: Update CA store
  ansible.builtin.command: update-ca-certificates
  become: true
  when: ca_copy.changed

- name: Unchanged config files from the deployment repository
  ansible.builtin.copy:
    src: "{{ spe_stack_dir }}/deployment/weskit_config/{{ item }}"
    dest: "{{ spe_stack_dir }}/config/weskit_config/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: [log-config.yaml, redis.conf]

- name: Rendered configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: weskit_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/weskit_config/config.yaml" }
    - { src: drs_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/drs_config.yaml" }
    - { src: trs_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/trs_config.yaml" }
    - { src: tls.yaml.j2, dest: "{{ spe_stack_dir }}/deployment/tls.yaml" }
    - { src: compose.install.yaml.j2, dest: "{{ spe_stack_dir }}/deployment/compose.install.yaml" }
  loop_control:
    label: "{{ item.dest | basename }}"
  register: rendered

- name: Validate compose file
  ansible.builtin.command: docker compose -f compose.install.yaml config --quiet
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  changed_when: false

- name: Databases and broker up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    services: [database, result_broker, drs-mongodb, trs-mongodb]
    state: present

# One non-looped task: `until` retries reliably on a non-zero rc, whereas
# `until` combined with `loop` does not retry a looped item that exits non-zero,
# so a MongoDB that is a moment slow to accept connections failed the run.
- name: Wait for MongoDB instances
  ansible.builtin.shell: |
    set -e
    for svc in database drs-mongodb trs-mongodb; do
      docker compose -f compose.install.yaml exec -T "$svc" \
        mongo --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -qx 1
    done
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  register: mongo_ping
  until: mongo_ping.rc == 0
  retries: 60
  delay: 2
  changed_when: false

- name: Initialise WESkit data volumes
  community.docker.docker_compose_v2_run:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    service: weskit-data-init
    cleanup: true
  changed_when: false

- name: Whole stack up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    state: present
    recreate: "{{ 'always' if rendered.changed or (cert.changed | default(false)) else 'auto' }}"

- name: Wait for the three APIs
  ansible.builtin.uri:
    url: "https://{{ spe_api_host }}{{ item }}"
    ca_path: "{{ spe_stack_dir }}/deployment/certs/traefik.crt"
    status_code: 200
  loop:
    - /ga4gh/wes/v1/service-info
    - /ga4gh/trs/v2/tools
    - /ga4gh/drs/v1/objects
  register: api_up
  until: api_up.status == 200
  retries: 60
  delay: 3

- name: WESkit worker can read the data mount
  ansible.builtin.command: >-
    docker compose -f compose.install.yaml exec -T --user 35671:35671 submission_worker
    sh -c 'test -r /drs-data && test -x /drs-data'
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  changed_when: false
