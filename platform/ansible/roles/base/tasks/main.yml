---
# Baseline for an SPE API instance: packages, Docker, data directory.
- name: Instance ownership marker
  ansible.builtin.copy:
    content: "{{ spe_instance }}\n"
    dest: /etc/spe-instance
    mode: "0644"

- name: Ownership manifest (what destroy.yml may reset)
  ansible.builtin.copy:
    content: "{{ spe_manifest | to_nice_json }}\n"
    dest: /etc/spe-instance.json
    mode: "0644"
  vars:
    spe_manifest:
      instance: "{{ spe_instance }}"
      provision: "{{ spe_provision }}"
      paths: "{{ (spe_preflight | default({})).resolved | default({'stack_dir': spe_stack_dir, 'frontend_dir': spe_frontend_dir, 'data_root': spe_data_root}, true) }}"
      compose_projects: "{{ spe_compose_projects }}"

- name: Detect existing Docker apt source
  ansible.builtin.shell: grep -rls download.docker.com /etc/apt/sources.list.d || true
  changed_when: false
  register: docker_source
  when: spe_manage_docker

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  when:
    - spe_manage_docker
    - docker_source.stdout | trim | length == 0

- name: Install Docker packages
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: spe_manage_docker

- name: Install packages
  ansible.builtin.apt:
    name: [git, curl, rsync, ca-certificates, python3-yaml, python3-docker]
    state: present
    update_cache: true
    cache_valid_time: 3600

# Only the seeding needs these, minutes from now; the install (slow on some
# mirrors) runs in the background and spe_data joins it (wait_packages.yml).
# No other apt task may run after this one is started.
- name: Seeding tools, installed in the background
  ansible.builtin.apt:
    name: [samtools, bcftools, tabix, age]
    state: present
  async: 1800
  poll: 0
  register: spe_apt_job
  changed_when: false   # the join (wait_packages.yml) reports the change

- name: Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker
  when: spe_manage_docker

- name: Docker enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: spe_manage_docker

- name: Deploy user may use Docker
  ansible.builtin.user:
    name: "{{ spe_ssh_user }}"
    groups: docker
    append: true
  when: spe_manage_docker

- name: Reset connection so the docker group applies
  ansible.builtin.meta: reset_connection

- name: Flush handlers (docker restart before anything uses it)
  ansible.builtin.meta: flush_handlers

- name: Docker answers (managed elsewhere)
  ansible.builtin.command: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
  changed_when: false
  become: false
  when: not spe_manage_docker

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0755"
  loop:
    - "{{ spe_data_root }}"
    - "{{ spe_stack_dir }}"
    - /opt/spe
    - /opt/spe/bin
